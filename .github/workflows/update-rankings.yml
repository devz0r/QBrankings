name: Update rankings

on:
  schedule:
    # 13:17 UTC Monday (Sunday games), Tuesday (Monday night) and Friday (Thursday night),
    # September through February.
    - cron: "17 13 * 9-12,1-2 1,2,5"
  workflow_dispatch:
    inputs:
      all_seasons:
        description: "Rebuild every season since 2016 (only needed after changing the formula)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "qbrank/**"
      - "site/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/update-rankings.yml"
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rankings-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test the formula
        run: python -m pytest -q

      - name: Build rankings
        if: github.event_name != 'pull_request'
        run: |
          if [ "${{ inputs.all_seasons }}" = "true" ]; then
            python -m qbrank.build --all
            python -m qbrank.validate
          else
            python -m qbrank.build
          fi

      - name: Commit updated data
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "Rankings unchanged."
          else
            summary=$(python -c "import json; d = json.load(open('site/data/index.json')); print(f\"{d['current']} through week {d['through_week']}\")")
            git commit -m "Update rankings: $summary"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Stamp asset versions
        # so browsers never pair a new page with a cached old script or stylesheet
        if: github.event_name != 'pull_request'
        run: |
          v="${GITHUB_SHA::8}"
          sed -i "s|href=\"style.css\"|href=\"style.css?v=$v\"|; s|src=\"app.js\"|src=\"app.js?v=$v\"|" site/index.html
          grep -q "app.js?v=$v" site/index.html

      - name: Package site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Requires Settings -> Pages -> Source: "GitHub Actions" (one-time setup).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
